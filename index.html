<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>흐름 · 현장 운영 접속</title><style>body{font:16px/1.7 system-ui,sans-serif;background:#eef5f3;color:#193f46;margin:0;min-height:100vh;display:grid;place-items:center}main{max-width:520px;margin:24px;padding:36px;background:white;border-radius:16px}h1{font-size:26px}a,button{display:inline-block;background:#087c78;color:white;border:0;border-radius:6px;padding:10px 18px;font:inherit;text-decoration:none}small{color:#61777b}#enter[hidden]{display:none}</style></head><body><main><small>흐름 · 고정 접속 입구</small><h1>현장 운영 관리</h1><p id="status" role="status">현재 서버 주소를 확인하고 있습니다…</p><a id="enter" hidden rel="noreferrer">현재 서버 열기</a> <button onclick="location.reload()">다시 확인</button><p><small>서버 컴퓨터가 켜져 있어야 접속할 수 있습니다. 연결 대상 변경 직후에는 반영에 시간이 걸릴 수 있습니다.</small></p></main><script>
(async()=>{const text=document.getElementById('status');try{const response=await fetch('./target.json?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('address');const data=await response.json();if(!data.url){text.textContent='서버 연결을 준비하고 있습니다. 잠시 후 다시 확인해주세요.';return}const url=new URL(data.url);if(url.protocol!=='https:'||!url.hostname.endsWith('.trycloudflare.com')||url.username||url.password||url.port||url.pathname!=='/'||url.search||url.hash)throw Error('invalid');const link=document.getElementById('enter');link.href=url.href;link.hidden=false;text.textContent='현재 서버로 연결합니다.';if(!location.search.includes('stay'))location.replace(url.href)}catch(e){text.textContent='서버 주소를 확인하지 못했습니다. 잠시 후 다시 확인해주세요.'}})();
</script></body></html>
